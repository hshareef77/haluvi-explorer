name: Build and publish Haluvi Explorer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Optional manual release build; normal releases run automatically after pushes to main
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-version-allocation-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify_pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests and build a debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reserve permanent Android version code
        id: version
        uses: hshareef77/haluvi-app-updates/.github/actions/allocate-android-version-code@f722f2bdb9bc9a8608fc1408564077cb5690b43d
        with:
          package-name: com.hussainshareef.haluviexplorer
          minimum-version-code: '30'
          github-token: ${{ github.token }}
      - name: Verify and restore permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: 01342D0E68C396BD1232F58CDC17E23CF330B26688420FEF0D822F8D4925D478
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Permanent Android signing secrets are missing from this repository. No APK or release was published."
            exit 1
          fi
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Permanent Android signing certificate fingerprint is invalid."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
          actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/android-signing/release.p12" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')
          echo "Signing certificate SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signing certificate does not match the permanent Haluvi signing identity. Release blocked."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          } >> "$GITHUB_ENV"
          echo "Permanent signing certificate verified."
      - name: Run road-network tests and build the signed APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs['version-code'] }}
        run: gradle --no-daemon -PappBuildNumber="$BUILD_NUMBER" :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature and prepare release file
        env:
          BUILD_NUMBER: ${{ steps.version.outputs['version-code'] }}
          EXPECTED_CERT_SHA256: 01342D0E68C396BD1232F58CDC17E23CF330B26688420FEF0D822F8D4925D478
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$apk" && test -s "$apk"
          signer=$(command -v apksigner || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          echo "APK signing certificate SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Built APK signature did not match the permanent key. Release blocked."
            exit 1
          fi
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          aapt="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-metadata.txt"
          grep -F "package: name='com.hussainshareef.haluviexplorer' versionCode='$BUILD_NUMBER' versionName='$version'" "$RUNNER_TEMP/apk-metadata.txt"
          test -n "$version"
          build="$BUILD_NUMBER"
          cp "$apk" "Haluvi-Explorer-v${version}.apk"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Verified signed APK: version $version, build $build."
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="Haluvi-Explorer-v${VERSION_NAME}.apk"
          test -s "$apk"
          tag="android-${BUILD_NUMBER}-${GITHUB_RUN_ID}"
          notes=$(printf 'Haluvi Explorer %s, build %s.\n\nSigned with the pinned permanent Haluvi Android key. Includes offline virtual road exploration using user-downloaded OpenStreetMap data.\n\nAutomated Kotlin road geometry tests passed before publishing. This is an experimental accessibility release; map coverage and place positions depend on OpenStreetMap.' "$VERSION_NAME" "$BUILD_NUMBER")
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Haluvi Explorer v${VERSION_NAME}" \
            --notes "$notes"
